<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ティナとライナ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ティナとライナの大冒険</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen arcade cabinet — portrait 9:16 playfield centered, controls hint beneath. Single dark theme by choice. */
:root {
  --night: #0b0e2a;
  --ink: #161b47;
  --line: #2c3374;
  --amber: #ffb547;
  --rose: #ff5d8f;
  --mint: #6ee7c8;
  --paper: #f3ead8;
  --dim: #8d92c4;
  --pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
html { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--pixel);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
.wrap {
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding-inline: 16px; padding-block: 10px;
  box-sizing: border-box;
}
.stage { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
canvas {
  display: block;
  border: 2px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 0 0 6px var(--ink), 0 18px 60px rgba(0,0,0,.5);
  image-rendering: pixelated;
  background: var(--night);
}
.hint {
  font-size: 12px; color: var(--dim); letter-spacing: .04em;
  display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; text-align: center;
}
.hint kbd {
  font-family: var(--pixel); font-size: 11px; color: var(--paper);
  border: 1px solid var(--line); background: var(--ink); border-radius: 3px; padding: 1px 5px;
}
.pad { position: absolute; display: none; gap: 10px; }
.pad button {
  font-family: var(--pixel); font-size: 14px; color: var(--paper);
  background: rgba(22,27,71,.75); border: 2px solid var(--line); border-radius: 50%;
  width: 58px; height: 58px; cursor: pointer;
}
.pad button.bomb { border-color: var(--rose); color: var(--rose); }
.pad button.sp { border-color: var(--line); color: var(--dim); font-size: 24px; }
.pad button.sp.ready { border-color: var(--amber); color: var(--night); background: var(--amber); animation: spglow 0.6s ease-in-out infinite alternate; }
@keyframes spglow { from { box-shadow: 0 0 0 0 rgba(255,181,71,0.7); } to { box-shadow: 0 0 0 8px rgba(255,181,71,0); } }
@media (prefers-reduced-motion: reduce) { .pad button.sp.ready { animation: none; } }
.pad button:focus-visible, .hint button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mute {
  font-family: var(--pixel); font-size: 12px; color: var(--paper); cursor: pointer;
  background: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px;
}
@media (pointer: coarse) {
  .pad { display: flex; }
  .hint .keys { display: none; }
}
@media (pointer: fine) {
  .hint .touch { display: none; }
}
</style>
</head>
<body>


<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv" width="360" height="640" aria-label="シューティングゲーム画面"></canvas>
    <div class="pad" id="pad">
      <button class="sp" id="spBtn" aria-label="必殺技 にくきゅうスタンプ">肉</button>
      <button class="bomb" id="bombBtn" aria-label="ボム">ボム</button>
      <button id="pauseBtn" aria-label="一時停止">II</button>
    </div>
  </div>
  <div class="hint">
    <span class="keys"><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> 移動</span>
    <span class="keys"><kbd>Shift</kbd> 低速</span>
    <span class="keys"><kbd>X</kbd> ボム</span>
    <span class="keys"><kbd>C</kbd> 必殺（肉）</span>
    <span class="keys"><kbd>P</kbd> ポーズ</span>
    <span class="touch">スマホ：ドラッグで移動・自動連射</span>
    <button class="mute" id="muteBtn">音 ON</button>
    <button class="mute" id="bgmBtn">BGM ON</button>
  </div>
</div>

<script>
(() => {
const W = 360, H = 640;
const C = { night:'#0b0e2a', ink:'#161b47', line:'#2c3374', amber:'#ffb547', rose:'#ff5d8f', mint:'#6ee7c8', paper:'#f3ead8', dim:'#8d92c4', violet:'#9b7bff' };
const FONT = '"DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stageEl = document.getElementById('stage');
const pad = document.getElementById('pad');
let scale = 1;

function fit() {
  const r = stageEl.getBoundingClientRect();
  scale = Math.max(0.3, Math.min(r.width / W, r.height / H));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const left = (r.width - W * scale) / 2, top = (r.height - H * scale) / 2;
  pad.style.right = (left + 12) + 'px';
  pad.style.bottom = (top + 14) + 'px';
}
addEventListener('resize', fit);

// ---------- Storage ----------
let hiScore = 0;
try { hiScore = +(localStorage.getItem('hoshikuzu-hi') || 0); } catch (e) {}
function saveHi() { try { localStorage.setItem('hoshikuzu-hi', String(hiScore)); } catch (e) {} }

// ---------- Cats ----------
const CATS = {
  tina: {
    name: 'ティナ', breed: 'ロシアンブルー', style: '集中ショット', note: 'まっすぐ高速連射・すばやい',
    fur: '#8fa2b8', dark: '#5f7189', eye: '#46d68c', inner: '#e8a6b4', nose: '#c98a9a',
    muzzle: null, belly: null, paw: '#7d90a7', eyeStyle: 'almond', smile: true, sharp: true, body: '#7d90a7', headScale: 0.84, ear: 1.35, bulk: true,
    shot: '#7ff0c0', speed: 4.8, slow: 2.3, rate: 4, stripes: false,
  },
  raina: {
    name: 'ライナ', breed: 'キジトラ', style: 'ワイド＋猫パンチ', note: '近づいた敵と弾をパンチ！',
    fur: '#9a7a4e', dark: '#4b3620', eye: '#c9d43e', inner: '#e8a6b4', nose: '#d58a8a',
    muzzle: '#f7f3ec', belly: '#f7f3ec', paw: '#f7f3ec', eyeStyle: 'big', slim: true,
    shot: '#ffc96b', speed: 4.1, slow: 2.0, rate: 6, stripes: true, longTail: true, puncher: true, bib: true,
  },
};
let selCat = 'tina';
try { const s = localStorage.getItem('hoshikuzu-cat'); if (CATS[s]) selCat = s; } catch (e) {}
const partnerOf = id => id === 'tina' ? 'raina' : 'tina';
const CARD_Y = 262, CARD_H = 168;
const CARDS = { tina: { x: 22, y: CARD_Y, w: 150, h: CARD_H }, raina: { x: W - 172, y: CARD_Y, w: 150, h: CARD_H } };
function selectCat(id) {
  if (selCat === id) return;
  selCat = id;
  try { localStorage.setItem('hoshikuzu-cat', id); } catch (e) {}
  catVoice(id, 'meow');
}

// ---------- Audio ----------
// master -> speakers; sfxBus (effects + cat voices) and bgmBus (music) feed the master.
let ac = null, muted = false, bgmOn = true, master = null, sfxBus = null, bgmBus = null;
try { bgmOn = localStorage.getItem('hoshikuzu-bgm') !== 'off'; } catch (e) {}
const muteBtn = document.getElementById('muteBtn');
const bgmBtn = document.getElementById('bgmBtn');
function syncAudioButtons() {
  muteBtn.textContent = muted ? '音 OFF' : '音 ON';
  bgmBtn.textContent = bgmOn ? 'BGM ON' : 'BGM OFF';
  if (master) master.gain.value = muted ? 0 : 1;
  if (bgmBus) bgmBus.gain.value = bgmOn ? 1.0 : 0;
}
muteBtn.addEventListener('click', () => { muted = !muted; syncAudioButtons(); muteBtn.blur(); });
bgmBtn.addEventListener('click', () => { bgmOn = !bgmOn; try { localStorage.setItem('hoshikuzu-bgm', bgmOn ? 'on' : 'off'); } catch (e) {} syncAudioButtons(); bgmBtn.blur(); });
syncAudioButtons();
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    bgmBus = ac.createGain(); bgmBus.connect(master);
    syncAudioButtons();
    setInterval(musicTick, 25);
  } catch (e) { ac = null; }
}
function tone(freq, dur = 0.08, type = 'square', vol = 0.05, slide = 0, when = 0) {
  if (!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(sfxBus);
  o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function getNoise() {
  if (noiseBuf) return noiseBuf;
  const len = ac.sampleRate;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function noise(dur = 0.3, vol = 0.12) {
  if (!ac) return;
  const t = ac.currentTime;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = getNoise();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(g).connect(sfxBus); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  shot: () => tone(880, 0.03, 'square', 0.012, -300),
  hit: () => tone(220, 0.04, 'square', 0.02, -80),
  boom: () => { noise(0.25, 0.1); tone(120, 0.25, 'triangle', 0.08, -80); },
  big: () => { noise(0.9, 0.18); tone(80, 0.8, 'sawtooth', 0.08, -50); },
  item: () => { tone(660, 0.06, 'square', 0.04); setTimeout(() => tone(990, 0.08, 'square', 0.04), 60); },
  die: () => { noise(0.6, 0.16); tone(400, 0.6, 'sawtooth', 0.07, -360); },
  bomb: () => { noise(0.8, 0.14); tone(60, 0.9, 'sine', 0.15, 200); },
  bossHit: () => { tone(190, 0.05, 'square', 0.035, -90); },
  punch: () => { tone(320, 0.07, 'square', 0.05, -200); noise(0.08, 0.06); },
  warn: () => { tone(440, 0.25, 'square', 0.04); setTimeout(() => tone(440, 0.25, 'square', 0.04), 400); },
};

// ---------- Cat voices (synthesised meows) ----------
// A sawtooth "voice" through a band-pass "mouth": opening the filter = "nya", closing = "n"/"u".
const VOICE = { tina: { f: 560, bright: 1 }, raina: { f: 740, bright: 1.15 } };
const VOICE_SHAPES = {
  // [time, pitch ratio, mouth Hz] keyframes
  meow:  { dur: 0.55, vol: 0.13, keys: [[0, 0.9, 700], [0.18, 1.35, 2500], [0.38, 1.1, 1500], [0.55, 0.8, 800]] },
  hurt:  { dur: 0.3,  vol: 0.16, keys: [[0, 1.6, 2600], [0.05, 1.95, 3200], [0.18, 1.3, 1800], [0.3, 0.9, 1000]] },
  happy: { dur: 0.24, vol: 0.11, keys: [[0, 1.0, 900], [0.08, 1.35, 2400], [0.16, 1.2, 1800], [0.24, 1.05, 900]] },
  sad:   { dur: 1.0,  vol: 0.12, keys: [[0, 1.1, 900], [0.25, 1.2, 2000], [0.7, 0.75, 1200], [1.0, 0.55, 600]] },
  trill: { dur: 0.32, vol: 0.09, keys: [[0, 1.1, 1200], [0.15, 1.3, 2000], [0.32, 1.25, 1500]], trill: 28 },
};
let voiceCD = 0;
function catVoice(cat, kind, when = 0) {
  if (!ac) return;
  const v = VOICE[cat], sh = VOICE_SHAPES[kind], t0 = ac.currentTime + when;
  const o = ac.createOscillator(), o2 = ac.createOscillator(), bp = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o2.type = 'triangle';
  bp.type = 'bandpass'; bp.Q.value = 4;
  for (const [t, p, m] of sh.keys) {
    const at = t0 + t, f = v.f * p;
    if (t === 0) { o.frequency.setValueAtTime(f, at); o2.frequency.setValueAtTime(f * 2, at); bp.frequency.setValueAtTime(m * v.bright, at); }
    else { o.frequency.linearRampToValueAtTime(f, at); o2.frequency.linearRampToValueAtTime(f * 2, at); bp.frequency.linearRampToValueAtTime(m * v.bright, at); }
  }
  // gentle vibrato
  const lfo = ac.createOscillator(), lg = ac.createGain();
  lfo.frequency.value = 7; lg.gain.value = v.f * 0.02; lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(sh.vol, t0 + 0.03);
  g.gain.setValueAtTime(sh.vol, t0 + sh.dur * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + sh.dur);
  const mix = ac.createGain(); mix.gain.value = 1;
  const g2 = ac.createGain(); g2.gain.value = 0.25;
  o.connect(bp); o2.connect(g2).connect(bp); bp.connect(g);
  if (sh.trill) {
    const am = ac.createOscillator(), ag = ac.createGain(), trem = ac.createGain();
    am.frequency.value = sh.trill; ag.gain.value = 0.5; trem.gain.value = 0.5;
    am.connect(ag).connect(trem.gain); g.connect(trem).connect(sfxBus);
    am.start(t0); am.stop(t0 + sh.dur + 0.05);
  } else g.connect(sfxBus);
  for (const n of [o, o2, lfo]) { n.start(t0); n.stop(t0 + sh.dur + 0.05); }
}
// Throttled "nyan!" when an enemy goes down, so it stays cute rather than constant.
function killVoice(big) {
  if (state !== 'play' || voiceCD > 0) return;
  if (!big && Math.random() > 0.3) return;
  const who = (partner && Math.random() < 0.3) ? partner.cat : player.cat;
  catVoice(who, 'happy'); voiceCD = big ? 40 : 70;
}

// ---------- BGM: tiny chiptune sequencer ----------
const NOTE = (() => { const m = {}; const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  for (let o = 1; o <= 7; o++) names.forEach((n, i) => { m[n + o] = 440 * Math.pow(2, (o * 12 + i - 57) / 12); }); return m; })();
// Each song: 4 bars of 16 steps. Melody tokens: note, "-" hold, "." rest. Chords give the bass line.
const SONGS = {
  meadow: { bpm: 132, wave: 'square', drums: 'k.h.s.h.kkh.s.h.',
    mel: 'E5 - G5 - C6 - G5 - E5 - D5 - C5 - D5 - | E5 - - - C5 - A4 - C5 - E5 - D5 - - - | F5 - A5 - C6 - A5 - F5 - E5 - D5 - C5 - | D5 - E5 - F5 - D5 - G5 - - - . . . .',
    chords: [['C3', 'E3', 'G3'], ['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3']] },
  river: { bpm: 116, wave: 'triangle', drums: 'k...h...s...h.h.',
    mel: 'A4 C5 F5 C5 A5 - G5 F5 E5 - F5 - C5 - - - | D5 F5 A5 F5 D6 - C6 A5 G5 - A5 - F5 - - - | D5 F5 A#5 F5 D6 - C6 A#5 A5 - G5 - F5 - - - | E5 G5 C6 G5 E5 - D5 - C5 - - - . . . .',
    chords: [['F2', 'A2', 'C3'], ['D2', 'F2', 'A2'], ['A#1', 'D2', 'F2'], ['C2', 'E2', 'G2']] },
  mountain: { bpm: 144, wave: 'square', drums: 'k.hks.h.k.hks.hh',
    mel: 'G4 - B4 - D5 - G5 - - - F#5 - G5 - A5 - | B5 - - - G5 - E5 - - - D5 - E5 - G5 - | E5 - - - C5 - E5 - G5 - - - E5 - C5 - | D5 - F#5 - A5 - - - F#5 - D5 - . . . .',
    chords: [['G2', 'B2', 'D3'], ['E2', 'G2', 'B2'], ['C2', 'E2', 'G2'], ['D2', 'F#2', 'A2']] },
  beach: { bpm: 126, wave: 'square', drums: 'k.hsk.hsk.hsk.hs',
    mel: 'F#5 . F#5 . A5 - F#5 . D5 . E5 . F#5 - - - | D5 . D5 . F#5 - D5 . B4 . C#5 . D5 - - - | B4 . D5 . G5 - F#5 . E5 . D5 . E5 - - - | C#5 - E5 - A5 - G5 - F#5 - E5 - . . . .',
    chords: [['D2', 'F#2', 'A2'], ['B1', 'D2', 'F#2'], ['G1', 'B1', 'D2'], ['A1', 'C#2', 'E2']] },
  boss: { bpm: 156, wave: 'sawtooth', drums: 'k.hks.h.k.hks.ss',
    mel: 'A4 A4 . A4 C5 . A4 . E5 - D5 - C5 - B4 - | C5 C5 . C5 F5 . C5 . A5 - G5 - F5 - E5 - | D5 D5 . D5 G5 . D5 . B5 - A5 - G5 - F5 - | E5 - G#5 - B5 - E6 - D6 - B5 - G#5 - E5 -',
    chords: [['A2', 'C3', 'E3'], ['F2', 'A2', 'C3'], ['G2', 'B2', 'D3'], ['E2', 'G#2', 'B2']] },
};
for (const s of Object.values(SONGS)) {
  s.steps = s.mel.replace(/\|/g, ' ').trim().split(/\s+/);
  const pat = [0, -1, 0, -1, 2, -1, 0, -1, 0, -1, 2, -1, 1, -1, 2, -1];
  s.bass = s.chords.flatMap(ch => pat.map(i => i < 0 ? null : ch[i]));
}
let song = null, songKey = null, step = 0, nextT = 0;
function playSong(key) {
  if (key === songKey) return;
  songKey = key; song = key ? SONGS[key] : null; step = 0;
  if (ac) nextT = ac.currentTime + 0.08;
}
function holdLen(s, i) { let n = 1; while (s.steps[(i + n) % s.steps.length] === '-' && n < 16) n++; return n; }
function musicTick() {
  if (!ac || !song || state === 'pause') { if (ac) nextT = Math.max(nextT, ac.currentTime + 0.05); return; }
  const sd = 60 / song.bpm / 4;
  while (nextT < ac.currentTime + 0.12) {
    const i = step % 64, t = nextT;
    const m = song.steps[i];
    if (m && NOTE[m]) seqNote(NOTE[m], t, sd * holdLen(song, i) * 0.92, song.wave, 0.075);
    const b = song.bass[i];
    if (b) seqNote(NOTE[b], t, sd * 1.6, 'triangle', 0.16);
    const d = song.drums[i % 16];
    if (d === 'k') drum(t, 'k'); else if (d === 's') drum(t, 's'); else if (d === 'h') drum(t, 'h');
    step++; nextT += sd;
  }
}
function seqNote(f, t, dur, wave, vol) {
  const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
  o.type = wave; o.frequency.setValueAtTime(f, t);
  lp.type = 'lowpass'; lp.frequency.value = wave === 'triangle' ? 4000 : 2200;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(vol * 0.55, t + Math.min(0.12, dur));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp).connect(g).connect(bgmBus); o.start(t); o.stop(t + dur + 0.02);
}
function drum(t, kind) {
  if (kind === 'k') {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.connect(g).connect(bgmBus); o.start(t); o.stop(t + 0.16);
    return;
  }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = getNoise();
  f.type = kind === 's' ? 'bandpass' : 'highpass'; f.frequency.value = kind === 's' ? 1800 : 7000;
  const dur = kind === 's' ? 0.12 : 0.035, vol = kind === 's' ? 0.09 : 0.035;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(bgmBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function jingle() {
  if (!ac) return;
  [['C5', 0], ['E5', 0.1], ['G5', 0.2], ['C6', 0.3], ['G5', 0.45], ['C6', 0.55]].forEach(([n, w]) => tone(NOTE[n], w > 0.5 ? 0.5 : 0.14, 'square', 0.05, 0, w));
}
function updateMusic() {
  let want = null;
  if (state === 'title' || state === 'splash') want = 'meadow';
  else if (state === 'play' || state === 'pause') {

// ---------- Input ----------
const keys = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  if (keys.has(k)) return;
  keys.add(k);
  initAudio();
  if (state === 'splash') { leaveSplash(); return; }
  if (state === 'title' && (k === 'arrowleft' || k === 'a')) selectCat('tina');
  if (state === 'title' && (k === 'arrowright' || k === 'd')) selectCat('raina');
  if (k === 'enter' || k === ' ' || k === 'z') onStartPress();
  if (k === 'x') useBomb();
  if (k === 'c') useSpecial();
  if (k === 'p' || k === 'escape') togglePause();
  if (k === 'm') muteBtn.click();
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); if (state === 'play') state = 'pause'; });

// The first touch anywhere unlocks sound (browsers require one) and moves on to the title.
function leaveSplash() {

  catVoice('tina', 'meow', 0.15); catVoice('raina', 'meow', 0.5);
}
document.addEventListener('pointerdown', e => {

}, true);
document.addEventListener('touchend', () => initAudio(), { passive: true });
// If this device allows sound without a tap (e.g. the Windows app), skip the splash.
setTimeout(() => { initAudio(); setTimeout(() => { if (ac && ac.state === 'running' && state === 'splash') state = 'title'; }, 200); }, 0);

let drag = null;
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state === 'title') {
    const p = toGame(e);
    for (const [id, card] of Object.entries(CARDS)) {
      if (p.x > card.x && p.x < card.x + card.w && p.y > card.y && p.y < card.y + card.h) {
        if (selCat === id) onStartPress(); else selectCat(id);
        return;
      }
    }
    if (p.y > CARD_Y + CARD_H) onStartPress();
    return;
  }
  if (state !== 'play') { onStartPress(); return; }
  drag = { id: e.pointerId, ...toGame(e) };
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || drag.id !== e.pointerId || state !== 'play') return;
  const p = toGame(e);
  const sens = e.pointerType === 'mouse' ? 1 : 1.25;
  player.x = clamp(player.x + (p.x - drag.x) * sens, 10, W - 10);
  player.y = clamp(player.y + (p.y - drag.y) * sens, 40, H - 16);
  drag.x = p.x; drag.y = p.y;
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
document.getElementById('bombBtn').addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); useBomb(); });
const spBtn = document.getElementById('spBtn');
spBtn.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); useSpecial(); });
document.getElementById('pauseBtn').addEventListener('pointerdown', e => { e.preventDefault(); togglePause(); });

// ---------- Helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// ---------- Game state ----------
let state = 'splash'; // splash | title | play | pause | over
let frame = 0, score = 0, stage = 1, stageT = 0, spawnT = 0, boss = null, bossWarned = false;
let flash = 0, shake = 0, banner = null, bombFx = 0;
let player, partner, pShots, eShots, enemies, items, parts, popups;


// ---------- 必殺技: にくきゅうスタンプ ----------
// Gauge fills by defeating enemies and hitting bosses; at 100 the two cats drop a giant paw.
const IS_TOUCH = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const SP_MAX = 100, SP_LEN = 120, SP_HIT = 72;
let special = null;
function addSp(v) {

  player.sp = Math.min(SP_MAX, player.sp + v);
  if (player.sp >= SP_MAX) { popup(player.x, player.y - 30, '必殺技OK！', C.amber, 14, 70); tone(880, 0.1, 'triangle', 0.06); tone(1320, 0.18, 'triangle', 0.06, 0, 0.1); }
}
function useSpecial() {

  player.sp = 0;
  const tx = boss && !boss.dead ? boss.x : W / 2, ty = boss && !boss.dead ? boss.y : H * 0.32;
  special = { t: 0, tx, ty };
  player.inv = Math.max(player.inv, SP_LEN + 60);
  catVoice(player.cat, 'meow'); catVoice(partner.cat, 'meow', 0.25);
  tone(523, 0.12, 'square', 0.05); tone(659, 0.12, 'square', 0.05, 0, 0.12); tone(784, 0.12, 'square', 0.05, 0, 0.24); tone(1047, 0.3, 'square', 0.06, 0, 0.36);
}
function updateSpecial() {
  const sp = special; sp.t++;
  if (sp.t < SP_HIT && sp.t % 3 === 0) eShots.length = 0;     // time stops: bullets vanish
  if (sp.t === SP_HIT) {
    shake = 30; flash = 26; sfx.big(); noise(0.5, 0.2);
    popup(sp.tx, sp.ty + 70, 'ドーーン！！', C.amber, 26, 80, 0.3);
    eShots.length = 0;
    for (const e of enemies) damageEnemy(e, 999);
    if (boss && !boss.dead) { damageBoss(Math.ceil(boss.max * 0.5)); if (!boss.dead) boss.rage = 60; }
    for (let i = 0; i < 4; i++) burst(sp.tx + rand(-50, 50), sp.ty + rand(-30, 40), 24, i % 2 ? C.amber : '#ffb3c7', 5);
  }
  if (sp.t >= SP_LEN) special = null;
}
function drawPaw(x, y, sc, fur, pad, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(sc, sc);
  E(3, 4, 26, 24, 'rgba(15,25,10,0.25)');
  E(0, 0, 25, 23, fur);
  E(0, 6, 11, 9, pad);                                         // main pad
  for (const [bx, by] of [[-15, -8], [-5.5, -15], [5.5, -15], [15, -8]]) E(bx, by, 4.6, 5.4, pad);
  E(-4, 2, 4, 2, 'rgba(255,255,255,0.35)');
  ctx.restore();
}
function drawSpecial() {
  const sp = special, t = sp.t;
  const k = CATS[player.cat];
  // dim the world
  ctx.fillStyle = `rgba(11,14,42,${Math.min(0.45, t / 20)})`; ctx.fillRect(0, 0, W, H);
  // cut-in band with both cats
  if (t < 60) {
    const inA = Math.min(1, t / 10), out = t > 48 ? (t - 48) / 12 : 0;
    const bandY = H * 0.62;
    ctx.save(); ctx.globalAlpha = inA * (1 - out);
    ctx.fillStyle = 'rgba(11,14,42,0.9)'; ctx.beginPath(); ctx.moveTo(0, bandY - 52); ctx.lineTo(W, bandY - 70); ctx.lineTo(W, bandY + 52); ctx.lineTo(0, bandY + 70); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.amber; ctx.fillRect(0, bandY - 58 - 4, W, 3); ctx.fillRect(0, bandY + 60, W, 3);
    const slide = (1 - Math.min(1, t / 14)) * 160;
    drawCat(80 - slide, bandY + 10, frame, player.cat, 2.6, false);
    drawCat(W - 80 + slide, bandY + 14, frame + 40, partner.cat, 2.4, false);
    text('ひっさつ！', W / 2, bandY - 26, 16, C.paper);
    text('にくきゅう', W / 2, bandY + 2, 26, C.amber);
    text('スタンプ！！', W / 2, bandY + 34, 26, C.amber);
    ctx.restore();
  }
  // the giant paw falls from the sky and stamps the target
  if (t >= 40) {
    const fall = Math.min(1, (t - 40) / (SP_HIT - 40));
    const y = -120 + (sp.ty + 120) * (fall * fall);
    const sc = 1.6 + (1 - fall) * 1.4;
    const alpha = t > SP_HIT + 25 ? Math.max(0, 1 - (t - SP_HIT - 25) / 23) : 1;
    drawPaw(sp.tx, y, sc, k.paw === '#f7f3ec' ? '#f7f3ec' : (k.body || k.fur), '#f2a0b8', alpha);

      ctx.beginPath(); ctx.arc(sp.tx, sp.ty, 40 + (t - SP_HIT) * 9, 0, TAU); ctx.stroke();
    }
  }
}

function resetGame() {
  score = 0; stage = 1;
  player = { x: W / 2, y: H - 90, lives: 3, bombs: 2, level: 1, cool: 0, inv: 120, alive: true, respawn: 0, cat: selCat, streak: 0, matatabi: 0, sp: 0 };
  partner = { x: W / 2 - 26, y: H - 70, cat: partnerOf(selCat), cool: 0, punch: 0, punchCD: 0, side: 1 };
  player.punch = 0; player.punchCD = 0; player.side = 1;

}
function startStage() {
  special = null;
  bgPrev = stage > 1 ? biomeOf(stage - 1) : null; bgFade = stage > 1 ? 90 : 0;
  stageT = 0; spawnT = 60; boss = null; bossWarned = false;
  pShots = []; eShots = []; enemies = []; items = []; parts = []; popups = [];
  banner = { text: `STAGE ${stage}`, sub: stageNames[(stage - 1) % stageNames.length], t: 150 };
}

function onStartPress() {

  else if (state === 'over' && overT > 40) { state = 'title'; newHi = false; }

// ---------- Spawning ----------
const diff = () => 1 + (stage - 1) * 0.22;
const STAGE_LEN = 2400; // frames before boss

function spawnWave() {
  const d = diff();
  const pick = Math.random();
  if (pick < 0.3) {
    const cx = rand(60, W - 60);
    for (let i = 0; i < 5; i++) {
      const off = i - 2;
      enemies.push(mkEnemy('drone', cx + off * 26, -20 - Math.abs(off) * 22));
    }
  } else if (pick < 0.55) {
    const cx = rand(50, W - 50);
    for (let i = 0; i < 4; i++) enemies.push(mkEnemy('weaver', cx, -20 - i * 34, { phase: i * 0.6 }));
  } else if (pick < 0.75) {
    const fromLeft = Math.random() < 0.5;
    for (let i = 0; i < 4; i++) {
      const e = mkEnemy('dart', fromLeft ? -20 - i * 30 : W + 20 + i * 30, rand(40, 160));
      e.vx = (fromLeft ? 1 : -1) * 3.4 * Math.min(1.5, d); e.vy = 1.4;
      enemies.push(e);
    }
  } else {
    enemies.push(mkEnemy('turret', rand(60, W - 60), -30));
    if (stage >= 2 && Math.random() < 0.5) enemies.push(mkEnemy('turret', rand(60, W - 60), -80));
  }
}
function mkEnemy(type, x, y, o = {}) {
  const base = {
    drone:  { hp: 1, r: 10, score: 100, vy: 1.8 },
    weaver: { hp: 3, r: 11, score: 150, vy: 1.3 },
    dart:   { hp: 1, r: 9,  score: 120, vy: 1.4 },
    turret: { hp: 14, r: 16, score: 500, vy: 1.4 },
  }[type];
  return { type, x, y, x0: x, vx: 0, vy: base.vy, hp: Math.ceil(base.hp * (type === 'turret' ? diff() : 1)), r: base.r, score: base.score, t: 0, hitT: 0, ...o };
}
function spawnBoss() {
  const hp = Math.round(320 + stage * 160);
  boss = { x: W / 2, y: -80, hp, max: hp, r: 34, t: 0, hitT: 0, enter: true, kind: BOSS_BY_BIOME[biomeOf(stage)] };
  banner = null;
}

// ---------- Shooting ----------
function aimAt(x, y, speed) {
  const a = Math.atan2(player.y - y, player.x - x);
  return { vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, a };
}
function eFire(x, y, vx, vy, r = 4, col = C.rose) { eShots.push({ x, y, vx, vy, r, col }); }
function fan(x, y, n, spread, speed, col) {
  const { a } = aimAt(x, y, 1);
  for (let i = 0; i < n; i++) {
    const ang = a + (n === 1 ? 0 : (i / (n - 1) - 0.5) * spread);
    eFire(x, y, Math.cos(ang) * speed, Math.sin(ang) * speed, 4, col);
  }
}
function ring(x, y, n, speed, rot = 0, col = C.violet) {
  for (let i = 0; i < n; i++) {
    const ang = rot + i / n * TAU;
    eFire(x, y, Math.cos(ang) * speed, Math.sin(ang) * speed, 4, col);
  }
}

function playerFire() {
  const x = player.x, y = player.y - 16, col = CATS[player.cat].shot, L = player.level;
  const add = (dx, vx, vy) => pShots.push({ x: x + dx, y, vx, vy, col });
  if (player.cat === 'tina') {
    const s = -13;
    add(-4, 0, s); add(4, 0, s);
    if (L >= 2) { add(-12, 0, s); add(12, 0, s); }
    if (L >= 3) { add(-7, -0.7, s); add(7, 0.7, s); }
  } else {
    const s = -10.5;
    const spread = [[0], [0, -1.5, 1.5], [0, -1.4, 1.4, -2.9, 2.9], [0, -1.2, 1.2, -2.5, 2.5, -3.9, 3.9]][L];
    for (const v of spread) add(v * 2, v, s);
  }
  if (frame % 8 === 0) sfx.shot();
}
// Raina's specialty: an automatic cat punch when something gets close.
const PUNCH_LEN = 14;
function tryPunch(c, sc) {
  if (c.punch > 0) c.punch--;
  if (c.punchCD > 0) { c.punchCD--; return; }
  if (!CATS[c.cat].puncher) return;
  const reach = 46 * sc, front = e => e.y < c.y + 12 * sc;
  const near = (o, r) => Math.hypot(o.x - c.x, o.y - c.y) < r && front(o);
  const target = enemies.some(e => !e.dead && near(e, reach + e.r)) || eShots.some(b => near(b, reach * 0.8))
    || (boss && !boss.dead && !boss.enter && Math.hypot(boss.x - c.x, boss.y - c.y) < reach + boss.r);
  if (!target) return;
  c.punch = PUNCH_LEN; c.punchCD = 30; c.side = -c.side;
  sfx.punch();
  let hit = 0;
  for (const e of enemies) if (!e.dead && near(e, reach + e.r + 6)) { damageEnemy(e, Math.round(6 * sc)); hit++; }
  for (const b of eShots) if (near(b, reach)) { b.dead = true; score += 20; burst(b.x, b.y, 3, C.paper, 2); hit++; }
  if (boss && !boss.dead && !boss.enter && Math.hypot(boss.x - c.x, boss.y - c.y) < reach + boss.r + 6) { damageBoss(Math.round(10 * sc)); hit++; }
  if (hit && Math.random() < 0.35) { popup(c.x + c.side * 18, c.y - 26, 'ニャッ！', C.amber); if (voiceCD <= 0) { catVoice(c.cat, 'happy'); voiceCD = 50; } }
}
function partnerFire() {
  const col = CATS[partner.cat].shot;
  pShots.push({ x: partner.x, y: partner.y - 10, vx: 0, vy: -11, col, small: true });
}

function useBomb() {
  if (state !== 'play' || !player.alive || player.bombs <= 0 || bombFx > 0) return;
  player.bombs--; bombFx = 70; flash = 18; shake = 16;
  player.inv = Math.max(player.inv, 100);
  for (const b of eShots) burst(b.x, b.y, 2, C.amber, 1.5);
  eShots.length = 0;
  for (const e of enemies) damageEnemy(e, 20);
  if (boss && !boss.enter) damageBoss(45);
  sfx.bomb();
}

// ---------- Effects ----------
function burst(x, y, n, col, sp = 3) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.5, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(20, 40), max: 40, col, s: rand(1.5, 3.5) });
  }
}
function popup(x, y, text, col = C.paper, size = 11, life = 50, vy = 0.6) { popups.push({ x, y, text, col, t: life, size, vy }); }
function bossSay(text, col, size, life) { popups = popups.filter(q => q.vy !== 0.15); popup(clamp(boss.x, 70, W - 70), boss.y + 64, text, col, size, life, 0.15); }

function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.hitT = 4;
  if (e.hp <= 0) {
    e.dead = true;
    if (!special) addSp(e.type === 'turret' ? 8 : 2.5);
    score += e.score; popup(e.x, e.y, e.score);
    killVoice(e.type === 'turret');
    if (player.alive && ++player.streak >= MATATABI_STREAK) { player.streak = 0; dropMatatabi(e.x, e.y, 'ノーミス30匹！'); }
    burst(e.x, e.y, e.type === 'turret' ? 26 : 12, e.type === 'turret' ? C.amber : C.mint, e.type === 'turret' ? 4 : 3);
    sfx.boom();
    if (e.type === 'turret') { shake = Math.max(shake, 6); items.push(mkItem(Math.random() < 0.75 ? 'P' : 'B', e.x, e.y)); }
    else if (Math.random() < 0.03) items.push(mkItem('P', e.x, e.y));
  }
}
function damageBoss(dmg) {
  if (!boss || boss.dead) return;
  const before = boss.hp / boss.max;
  boss.hp -= dmg; boss.hitT = 3;
  const after = boss.hp / boss.max;
  if (boss.hp > 0 && before >= 0.5 && after < 0.5) {
    boss.rage = 90; shake = Math.max(shake, 16); flash = 8; bossVoice('roar');
    bossSay(BOSS_DEFS[boss.kind].rageCry, C.rose, 20, 90);
  } else if (boss.hp > 0 && Math.ceil(before * 10) !== Math.ceil(after * 10)) {
    boss.rage = Math.max(boss.rage || 0, 40); bossVoice(Math.random() < 0.5 ? 'cry' : 'grunt');
    const cries = BOSS_DEFS[boss.kind].cries; bossSay(cries[Math.floor(Math.random() * cries.length)], C.amber, 16, 60);
  }
  if (boss.hp <= 0) {
    boss.dead = true; boss.deathT = 110; boss.rage = 0;
    bossVoice('dizzy'); bossSay(BOSS_DEFS[boss.kind].down, C.paper, 18, 100);
    const bonus = 10000 * stage;
    score += bonus;
    eShots.length = 0;
    flash = 24; shake = 30; sfx.big(); jingle();
    catVoice(player.cat, 'meow', 0.7); catVoice(partner.cat, 'meow', 1.0);
    for (let i = 0; i < 6; i++) setTimeout(() => { burst(boss.x + rand(-40, 40), boss.y + rand(-30, 30), 30, i % 2 ? C.amber : C.rose, 5); sfx.boom(); }, i * 140);
    banner = { text: 'STAGE CLEAR', sub: `ボーナス ${bonus.toLocaleString()}`, t: 220, clear: true };
    items.push(mkItem('P', boss.x - 20, boss.y), mkItem('B', boss.x + 20, boss.y));
    if (boss.noMiss !== false) dropMatatabi(boss.x, boss.y + 10, 'ノーミス撃破！');

}
// マタタビ: earned by good play (30 kills in a row without a miss, or a no-miss boss win)
const MATATABI_STREAK = 30, MAX_LIVES = 5;
function dropMatatabi(x, y, why) {
  items.push(mkItem('M', x, y));
  popup(x, y - 18, why, C.mint, 13, 70);
  tone(988, 0.08, 'triangle', 0.05, 0, 0); tone(1319, 0.12, 'triangle', 0.05, 0, 0.08);
}
function mkItem(kind, x, y) { return { kind, x, y, vy: -2.5, t: 0 }; }

function hitPlayer() {
  if (player.inv > 0 || !player.alive) return;
  player.alive = false; player.respawn = 70;
  player.streak = 0;
  if (boss && !boss.dead) boss.noMiss = false;
  if (boss && !boss.dead && !boss.enter) { bossVoice('laugh', 0.35); bossSay(BOSS_DEFS[boss.kind].laugh, C.amber, 16, 70); boss.rage = 30; }
  burst(player.x, player.y, 40, C.amber, 5); burst(player.x, player.y, 20, C.paper, 3);
  shake = 20; flash = 10; noise(0.4, 0.1); catVoice(player.cat, 'hurt');
  popup(player.x, player.y - 20, 'にゃっ！', C.rose);
  player.lives--;
  if (player.lives < 0) {
    player.respawn = 0;
    setTimeout(() => { state = 'over'; overT = 0; if (score > hiScore) { hiScore = score; saveHi(); newHi = true; } catVoice(player.cat, 'sad'); catVoice(partner.cat, 'sad', 0.5); }, 900);
  }
}
let overT = 0, newHi = false;

// ---------- Update ----------
function update() {
  frame++;
  bgY = (bgY + 1.1) % BG_H; if (bgFade > 0) bgFade--;
  if (state !== 'play') { if (state === 'over') overT++; updateFx(); return; }
  if (special) { updateSpecial(); for (const e of enemies) if (e.hitT) e.hitT--; if (boss && boss.hitT) boss.hitT--; if (boss && boss.dead && boss.deathT > 0) boss.deathT--; if (player.inv > 0) player.inv--; updateFx(); return; }
  stageT++;
  if (banner) { banner.t--; if (banner.t <= 0) { const wasClear = banner.clear; banner = null; if (wasClear) { stage++; startStage(); } } }

  // player
  if (player.alive) {
    let dx = 0, dy = 0;
    if (keys.has('arrowleft') || keys.has('a')) dx--;
    if (keys.has('arrowright') || keys.has('d')) dx++;
    if (keys.has('arrowup') || keys.has('w')) dy--;
    if (keys.has('arrowdown') || keys.has('s')) dy++;
    const slow = keys.has('shift');
    const sp = slow ? CATS[player.cat].slow : CATS[player.cat].speed;
    if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
    player.x = clamp(player.x + dx * sp, 10, W - 10);
    player.y = clamp(player.y + dy * sp, 40, H - 16);
    player.slow = slow;
    const firing = !(banner && banner.clear);
    if (player.cool-- <= 0 && firing) { playerFire(); player.cool = CATS[player.cat].rate; }
    if (player.inv > 0) player.inv--;
    if (player.matatabi > 0) {
      player.matatabi--;
      if (player.matatabi % 9 === 0) popup(player.x + rand(-14, 14), player.y - 18, '♥', C.rose, rand(10, 15), 40, 0.9);
      if (player.matatabi % 13 === 0) popup(partner.x + rand(-10, 10), partner.y - 14, '♥', '#ffb3c7', 10, 36, 0.9);
    }
    // partner cat follows on the left, a little behind
    const tx = player.x - 26 * (player.x > 40 ? 1 : -1), ty = player.y + 18;
    partner.x += (tx - partner.x) * 0.12; partner.y += (ty - partner.y) * 0.12;
    if (partner.cool-- <= 0 && firing) { partnerFire(); partner.cool = 9; }
    tryPunch(player, 1); tryPunch(partner, 0.75);
    if (frame % 3 === 0) parts.push({ x: player.x + rand(-3, 3), y: player.y + 16, vx: rand(-0.3, 0.3), vy: rand(1, 2), life: 18, max: 18, col: CATS[player.cat].shot, s: 2 });
  } else if (player.respawn > 0) {
    if (--player.respawn === 0) {
      player.alive = true; player.x = W / 2; player.y = H - 90; player.inv = 150;
      player.level = Math.max(1, player.level - 1); player.bombs = Math.max(player.bombs, 2);
    }
  }

  // spawns
  if (!boss && !(banner && banner.clear)) {
    if (stageT < STAGE_LEN) {
      if (--spawnT <= 0) { spawnWave(); spawnT = Math.max(48, 115 - stage * 9) + rand(0, 30); }
    } else if (!bossWarned && enemies.length === 0) {
      bossWarned = true; banner = { text: 'WARNING', sub: `ボス ${BOSS_DEFS[BOSS_BY_BIOME[biomeOf(stage)]].name} 接近中！`, t: 140, warn: true }; sfx.warn();
      setTimeout(() => { if (state === 'play' || state === 'pause') spawnBoss(); }, 2300);
    }
  }

  const d = diff();
  // enemies
  for (const e of enemies) {
    e.t++; if (e.hitT) e.hitT--;
    switch (e.type) {
      case 'drone': e.y += e.vy * Math.min(1.4, d); if (e.t === 50 && stage >= 2 && Math.random() < 0.35) fan(e.x, e.y, 1, 0, 2.6 * d); break;
      case 'weaver':
        e.y += e.vy; e.x = e.x0 + Math.sin(e.t / 26 + e.phase) * 46;
        if (e.t === 70 || (stage >= 3 && e.t === 150)) fan(e.x, e.y, 1, 0, 2.8 * d, C.rose);
        break;
      case 'dart': e.x += e.vx; e.y += e.vy; break;
      case 'turret':
        if (e.t < 70) e.y += e.vy;
        else if (e.t > 420) e.y -= 1.2;
        else if ((e.t - 70) % Math.round(70 / Math.min(1.6, d)) === 0) fan(e.x, e.y, 3 + Math.min(2, stage - 1), 0.7, 2.4 * d, C.amber);
        break;
    }
    if (player.alive && Math.hypot(e.x - player.x, e.y - player.y) < e.r * 0.75 + 3) hitPlayer();
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 40 && e.y > -200 && e.x > -200 && e.x < W + 200 && !(e.type === 'turret' && e.t > 420 && e.y < -40));

  // boss
  if (boss && !boss.dead) {
    const b = boss; b.t++; if (b.hitT) b.hitT--;
    if (b.enter) {
      b.y += 1.4;
      if (b.y >= 120) { b.enter = false; b.t = 0; b.rage = 70; bossVoice('roar'); shake = Math.max(shake, 10); bossSay(BOSS_DEFS[b.kind].entry, C.rose, 20, 80); }
    } else {
      if (b.rage > 0) b.rage--;
      bossMove(b);
      bossAttack(b, 2.2 * Math.min(1.5, 0.85 + stage * 0.15));
    }
    if (player.alive && Math.hypot(b.x - player.x, b.y - player.y) < b.r + 3) hitPlayer();
  }

  if (boss && boss.dead && boss.deathT > 0) boss.deathT--;

  // player shots
  for (const s of pShots) {
    s.x += s.vx; s.y += s.vy;
    for (const e of enemies) {
      if (!e.dead && Math.abs(s.x - e.x) < e.r && Math.abs(s.y - e.y) < e.r) { s.dead = true; damageEnemy(e, 1); if (!e.dead) sfx.hit(); break; }
    }
    if (!s.dead && boss && !boss.dead && !boss.enter && Math.abs(s.x - boss.x) < boss.r + 4 && Math.abs(s.y - boss.y) < boss.r) {
      s.dead = true; damageBoss(1); score += 10; addSp(0.05); if (frame % 4 === 0) sfx.bossHit();
      if (Math.random() < 0.3) burst(s.x, s.y, 1, C.paper, 1.5);
    }
  }
  pShots = pShots.filter(s => !s.dead && s.y > -20 && s.x > -20 && s.x < W + 20);

  // enemy shots
  if (bombFx > 0) { bombFx--; eShots.length = 0; }
  for (const b of eShots) {
    b.x += b.vx; b.y += b.vy;
    if (player.alive && player.inv <= 0 && Math.hypot(b.x - player.x, b.y - player.y) < b.r * 0.6 + 2.5) { b.dead = true; hitPlayer(); }
  }
  eShots = eShots.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // items
  for (const it of items) {
    it.t++; it.vy = Math.min(1.6, it.vy + 0.08); it.y += it.vy;
    if (player.alive) {
      const dist = Math.hypot(it.x - player.x, it.y - player.y);
      if (player.y < 160 || dist < 60) { it.x += (player.x - it.x) * 0.12; it.y += (player.y - it.y) * 0.12; }
      if (dist < 16) {
        it.dead = true; sfx.item(); catVoice(player.cat, 'trill', 0.1);
        if (it.kind === 'P') { if (player.level < 3) { player.level++; popup(it.x, it.y, 'ビッツでパワーアップ！', C.amber, 12); } else { score += 2000; popup(it.x, it.y, 'ビッツ ボーナス 2000', C.amber, 12); } }
        else if (it.kind === 'B') { if (player.bombs < 5) { player.bombs++; popup(it.x, it.y, 'サラミでボム+1！', C.rose, 12); } else { score += 2000; popup(it.x, it.y, 'サラミ ボーナス 2000', C.rose, 12); } }
        else {
          if (player.lives < MAX_LIVES) { player.lives++; popup(it.x, it.y - 6, 'マタタビでいのち+1！', C.mint, 14, 80); } else { score += 5000; popup(it.x, it.y - 6, 'マタタビ ボーナス 5000', C.mint, 13, 70); }
          player.matatabi = 200; player.inv = Math.max(player.inv, 200);
          catVoice(player.cat, 'meow', 0.15); catVoice(partner.cat, 'trill', 0.5); catVoice(player.cat, 'trill', 0.9);
        }
      }
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 20);

  if (score > hiScore) hiScore = score;
  updateFx();
}
function updateFx() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  parts = (parts || []).filter(p => p.life > 0);
  for (const p of popups || []) { p.y -= p.vy ?? 0.6; p.t--; }
  if (popups) popups = popups.filter(p => p.t > 0);
  if (flash > 0) flash--;
  if (shake > 0) shake *= 0.86, shake < 0.4 && (shake = 0);
}

// ---------- Draw ----------
// A flying cat seen from the front. Origin = chest (where the hitbox sits).
function drawCat(x, y, t, id, s = 1, blink = false, punch = 0, side = 1) {
  const k = CATS[id];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const ell = (cx, cy, rx, ry, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, TAU); ctx.fill(); };
  const bw = k.slim ? 6.2 : k.bulk ? 9.6 : 8, hw = k.slim ? 10.8 : 12, es = hw / 12;
  // tail (swishing)
  const sw = Math.sin(t * 0.12) * 6;
  ctx.lineCap = 'round';
  ctx.strokeStyle = k.body || k.fur; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bw - 4, 10);
  if (k.longTail) ctx.bezierCurveTo(bw + 9 + sw * 0.5, 17, bw + 11 + sw, 2, bw + 7 + sw * 1.4, -10);
  else ctx.quadraticCurveTo(bw + 6 + sw, 14, bw + 4 + sw, 2);
  ctx.stroke();
  if (k.stripes) { ctx.strokeStyle = k.dark; ctx.lineWidth = 4; ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]); }
  // body
  ell(0, 7, bw, 8.5, k.body || k.fur);
  if (k.bulk) {
    // broad chest and shoulders
    ell(0, 3.5, bw + 0.8, 6, k.body || k.fur);
    ell(-(bw - 1.5), 2.5, 3.8, 3.8, k.body || k.fur); ell(bw - 1.5, 2.5, 3.8, 3.8, k.body || k.fur);
    ctx.strokeStyle = 'rgba(40,52,70,0.35)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-3.5, 5); ctx.quadraticCurveTo(0, 7, 3.5, 5); ctx.moveTo(0, 6.2); ctx.lineTo(0, 10); ctx.stroke();
  }
  // hind feet (peek out at the sides)
  ell(-(bw - 1.3), 14, 2.4, 2, k.paw); ell(bw - 1.3, 14, 2.4, 2, k.paw);
  if (k.belly) ell(0, 9, bw * 0.55, 5.5, k.belly);
  if (k.stripes) {
    ctx.strokeStyle = k.dark; ctx.lineWidth = 1.4;
    for (const yy of [3, 7]) { ctx.beginPath(); ctx.moveTo(-bw, yy); ctx.quadraticCurveTo(-bw * 0.62, yy + 1.5, -bw * 0.42, yy - 0.5); ctx.stroke(); ctx.beginPath(); ctx.moveTo(bw, yy); ctx.quadraticCurveTo(bw * 0.62, yy + 1.5, bw * 0.42, yy - 0.5); ctx.stroke(); }
  }
  // front paws (paddle while flying)
  const pw = Math.sin(t * 0.3) * 1.2;
  for (const [px, py, sd] of [[-bw * 0.45, 15 + pw, -1], [bw * 0.45, 15 - pw, 1]]) {
    if (punch > 0 && sd === side) continue;
    const pr = k.bulk ? 1.2 : 1;
    ell(px, py, 2.8 * pr, 2.3 * pr, k.paw);
    if (!k.belly) { ctx.strokeStyle = k.dark; ctx.lineWidth = 0.6; ctx.beginPath(); ctx.ellipse(px, py, 2.8 * pr, 2.3 * pr, 0, 0, TAU); ctx.stroke(); }
  }
  // head group (scaled around the neck so a small face still sits on the body)
  const hs = k.headScale || 1;
  ctx.save(); ctx.translate(0, 1); ctx.scale(hs, hs); ctx.translate(0, -1);
  // ears (grown from their base by k.ear)
  const ef = k.ear || 1;
  for (const sgn of [-1, 1]) {
    const mx = sgn * (11 * es + 2) / 2, my = -12;
    const P = (px, py, f) => [mx + (px - mx) * f, my + (py - my) * f];
    const tri = (pts, col) => { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath(); ctx.fill(); };
    const bf = 1 + (ef - 1) * 0.5;
    tri([P(sgn * 11 * es, -9, bf), P(sgn * 9 * es, -21, ef), P(sgn * 2, -15, bf)], k.fur);
    tri([P(sgn * 9.5 * es, -11, bf), P(sgn * 8.5 * es, -18, ef), P(sgn * 4.5 * es, -14.5, bf)], k.inner);
  }
  // head
  if (k.sharp) {
    // wedge-ish head: full cheeks tapering to a neat chin
    ctx.fillStyle = k.fur; ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.bezierCurveTo(7, -18, hw, -14.5, hw, -8.5);
    ctx.bezierCurveTo(hw, -3.5, 3.5, 2.2, 0, 2.4);
    ctx.bezierCurveTo(-3.5, 2.2, -hw, -3.5, -hw, -8.5);
    ctx.bezierCurveTo(-hw, -14.5, -7, -18, 0, -18);
    ctx.fill();
  } else ell(0, -8, hw, 10, k.fur);
  if (k.muzzle) ell(0, -3.6, 6.5, 4.6, k.muzzle);
  if (k.bib) {
    // white runs from the muzzle down the chin into the chest
    ell(0, 0.5, 4.6, 4.6, k.muzzle);
    ell(0, 4.5, bw * 0.6, 3.5, k.belly);
  }
  if (k.stripes) {
    // forehead "M" and cheek stripes of a brown tabby
    ctx.strokeStyle = k.dark; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-4, -17); ctx.lineTo(-2.5, -12.5); ctx.lineTo(0, -16); ctx.lineTo(2.5, -12.5); ctx.lineTo(4, -17); ctx.stroke();
    for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sgn * hw, -7); ctx.lineTo(sgn * (hw - 3), -6); ctx.moveTo(sgn * (hw - 0.5), -4); ctx.lineTo(sgn * (hw - 3), -3.5); ctx.stroke(); }
  }
  // eyes
  for (const sgn of [-1, 1]) {
    if (k.eyeStyle === 'big') {
      // big round eyes with large dark pupils
      const ex = sgn * 5, ey = -9.2;
      if (blink) {
        ctx.strokeStyle = k.dark; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.arc(ex, ey, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      } else {
        ell(ex, ey, 3.8, 3.9, k.eye);
        ell(ex, ey + 0.2, 2.7, 2.9, '#16101c');
        ell(ex + 1.1, ey - 1.3, 1.1, 1.1, '#ffffff');
        ell(ex - 1.2, ey + 1.3, 0.5, 0.5, '#ffffff');
      }
    } else {
      // compact round eyes, outer corners tilted up
      const ex = sgn * 4.7, ey = -9.4, tilt = -sgn * 0.45;
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(tilt);
      if (blink) {
        ctx.strokeStyle = k.dark; ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(-2.6, 0.3); ctx.lineTo(2.6, 0.3); ctx.stroke();
      } else {
        ell(0, 0, 3.1, 2.6, k.eye);
      }
      ctx.restore();
      if (!blink) {
        // pupil stays vertical even though the eye is tilted
        ctx.save(); ctx.beginPath(); ctx.ellipse(ex, ey, 3.1, 2.6, tilt, 0, TAU); ctx.clip();
        ell(ex, ey, 1, 2.4, '#16101c');
        ell(ex + 0.9, ey - 1, 0.6, 0.6, '#ffffff');
        ctx.restore();
      }
    }
  }
  // nose + mouth
  ctx.fillStyle = k.nose;
  ctx.beginPath(); ctx.moveTo(-1.5, -5.6); ctx.lineTo(1.5, -5.6); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = k.dark; ctx.lineWidth = 0.9;
  ctx.beginPath();
  if (k.smile) { ctx.lineWidth = 1; ctx.moveTo(0, -4); ctx.bezierCurveTo(-0.3, -0.8, -3.6, -0.4, -4.6, -4.8); ctx.moveTo(0, -4); ctx.bezierCurveTo(0.3, -0.8, 3.6, -0.4, 4.6, -4.8); }
  else { ctx.moveTo(0, -4); ctx.quadraticCurveTo(-1.5, -2, -3, -3); ctx.moveTo(0, -4); ctx.quadraticCurveTo(1.5, -2, 3, -3); }
  ctx.stroke();
  // whiskers
  ctx.strokeStyle = 'rgba(243,234,216,0.75)'; ctx.lineWidth = 0.6;
  for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sgn * 6, -4.5); ctx.lineTo(sgn * 16, -6.5); ctx.moveTo(sgn * 6, -3.5); ctx.lineTo(sgn * 16, -2.5); ctx.stroke(); }
  ctx.restore();
  if (punch > 0) {
    // punching arm swings up beside the head
    const ext = Math.sin((1 - punch / PUNCH_LEN) * Math.PI);
    const ax = side * (bw * 0.6), ay = 6;
    const px = side * (bw + 3 + ext * 8), py = 14 - ext * 30;
    ctx.strokeStyle = k.body || k.fur; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py + 2); ctx.stroke();
    if (k.stripes) { ctx.strokeStyle = k.dark; ctx.lineWidth = 4.5; ctx.setLineDash([1.5, 3]); ctx.stroke(); ctx.setLineDash([]); }
    const r = 3 + ext * 1.4;
    ell(px, py, r, r * 0.9, k.paw);
    ell(px, py + r * 0.15, r * 0.45, r * 0.38, k.inner);
    for (const tx of [-0.55, 0, 0.55]) ell(px + tx * r, py - r * 0.55, r * 0.2, r * 0.2, k.inner);
  }
  ctx.restore();
}
const isBlink = t => (t % 200) < 8;
// ---- enemy art: all drawn facing down the screen (toward the cats) ----
const E = (cx, cy, rx, ry, col, rot = 0) => { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, rot, 0, TAU); ctx.fill(); };
function hitFlash(on) { ctx.filter = on ? 'brightness(2.4) saturate(0.4)' : 'none'; }

function drawLadybug(e) {
  // seven-spot ladybird, top view, head toward the bottom
  ctx.rotate(Math.sin(e.t * 0.15) * 0.25);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  const wig = Math.sin(e.t * 0.6) * 1.2;
  for (const s of [-1, 1]) for (const [y, d] of [[4, 1], [0, -1], [-4, 1]]) {
    ctx.beginPath(); ctx.moveTo(s * 7, y); ctx.lineTo(s * 11, y + 2 + d * wig); ctx.stroke();
  }
  E(0, 8.5, 4.6, 3.6, '#111');                 // head
  E(-2, 10, 0.9, 0.9, '#fff'); E(2, 10, 0.9, 0.9, '#fff');
  E(0, 5.6, 6.6, 3, '#111');                   // pronotum
  E(-4.3, 5.8, 1.6, 1.2, '#f4f0e6'); E(4.3, 5.8, 1.6, 1.2, '#f4f0e6');
  E(0, -1.5, 9, 9.6, '#e0322b');               // shell
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 5); ctx.stroke();
  E(0, 3.6, 2.3, 1.8, '#111');                 // the 7th spot, shared by both wings
  for (const s of [-1, 1]) { E(s * 4.6, 0.5, 2, 2, '#111'); E(s * 5.6, -5, 1.9, 1.9, '#111'); E(s * 2.6, -8.3, 1.6, 1.6, '#111'); }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(-3, -3, 5, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
}

function drawDragonfly(e) {
  // oniyanma: black with yellow bands, emerald compound eyes, head toward the bottom
  ctx.rotate(Math.sin(e.t / 26 + e.phase) * 0.35);
  const flap = 0.75 + Math.abs(Math.sin(e.t * 0.9)) * 0.35;
  for (const [y, len, w] of [[4, 17, 3.4], [0.5, 16, 3.6]]) for (const s of [-1, 1]) {
    ctx.fillStyle = 'rgba(214,232,255,0.42)'; ctx.strokeStyle = 'rgba(214,232,255,0.7)'; ctx.lineWidth = 0.6;
    ctx.beginPath(); ctx.ellipse(s * len * flap / 2 + s * 2, y, len * flap / 2, w, s * -0.08, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#16140f'; ctx.fillRect(-1.6, -19, 3.2, 20);       // abdomen
  ctx.fillStyle = '#f2c531';
  for (let y = -17; y < 0; y += 3.6) ctx.fillRect(-1.6, y, 3.2, 1.3);
  E(0, 3.2, 3.4, 4.4, '#16140f');                                       // thorax
  ctx.strokeStyle = '#f2c531'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(-2.4, 1); ctx.lineTo(-0.8, 5.6); ctx.moveTo(2.4, 1); ctx.lineTo(0.8, 5.6); ctx.stroke();
  E(0, 8.4, 2.2, 1.6, '#f2c531');                                       // face
  E(-2.2, 9.4, 2.5, 2.5, '#2fcf78'); E(2.2, 9.4, 2.5, 2.5, '#2fcf78');  // eyes
  E(-1.5, 8.6, 0.7, 0.7, '#d9ffe9'); E(2.9, 8.6, 0.7, 0.7, '#d9ffe9');
}

function drawPigeon(e) {
  // blue-grey body, iridescent purple head, flying in its travel direction
  ctx.rotate(Math.atan2(e.vy, e.vx) - Math.PI / 2);
  const flap = Math.sin(e.t * 0.55);
  const span = 11 + flap * 4;
  ctx.fillStyle = '#5f6f99';                                            // tail fan
  ctx.beginPath(); ctx.moveTo(-2.5, -5); ctx.lineTo(-5, -13); ctx.lineTo(5, -13); ctx.lineTo(2.5, -5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2e3550'; ctx.fillRect(-5, -13, 10, 1.8);
  for (const s of [-1, 1]) {                                            // wings with the two dark bars
    ctx.fillStyle = '#8796c2';
    ctx.beginPath(); ctx.moveTo(s * 3, 3); ctx.quadraticCurveTo(s * span, 5 + flap * 2, s * (span + 2), -3); ctx.lineTo(s * 3, -4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2e3550'; ctx.lineWidth = 1;
    for (const f of [0.45, 0.62]) { ctx.beginPath(); ctx.moveTo(s * (3 + span * f * 0.6), 0); ctx.lineTo(s * (3 + span * f), -3); ctx.stroke(); }
    ctx.fillStyle = '#3a4466';
    ctx.beginPath(); ctx.moveTo(s * (span - 1), 2); ctx.lineTo(s * (span + 2), -3); ctx.lineTo(s * (span - 2), -2.5); ctx.closePath(); ctx.fill();
  }
  E(0, -0.5, 4.2, 7.5, '#7d8dbd');                                     // body
  // neck + head shimmer between purple and green
  const sh = (Math.sin(e.t * 0.12) + 1) / 2;
  const g = ctx.createLinearGradient(-4, 3, 4, 11);
  g.addColorStop(0, '#7b4fc9'); g.addColorStop(0.5 + sh * 0.3, '#3fbf98'); g.addColorStop(1, '#9a5ed8');
  E(0, 5.5, 3.8, 3.4, g);
  E(0, 9.4, 3, 3, '#8a62cf');
  E(-0.8, 8.6, 1.3, 1, 'rgba(255,255,255,0.35)');
  E(-1.7, 10, 0.75, 0.75, '#ff8a3d'); E(1.7, 10, 0.75, 0.75, '#ff8a3d');
  ctx.fillStyle = '#d7c9c0';                                            // beak
  ctx.beginPath(); ctx.moveTo(-1, 12); ctx.lineTo(0, 14.6); ctx.lineTo(1, 12); ctx.closePath(); ctx.fill();
}

function drawTanuki(e) {
  // front-facing tanuki with a transformation leaf on its head
  const bob = Math.sin(e.t * 0.12) * 1;

  for (const s of [-1, 1]) { E(s * 10.5, -11, 4.2, 4.2, '#3a2a1e'); E(s * 10.5, -10.5, 2.2, 2.2, '#b08a63'); }

  ctx.strokeStyle = '#2b7a40'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -8); ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  hitFlash(e.hitT > 0);
  switch (e.type) {

}

function bossVoice(kind, when = 0) {
  if (!ac || !boss) return;
  const k = boss.kind, t0 = ac.currentTime + when;
  const call = (t, f0, f1, f2, dur, mouth, vol, wave = 'sawtooth', q = 3) => {
    const o = ac.createOscillator(), bp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = wave; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + dur * 0.35); o.frequency.linearRampToValueAtTime(f2, t + dur);
    bp.type = 'bandpass'; bp.frequency.value = mouth; bp.Q.value = q;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.setValueAtTime(vol, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(bp).connect(g).connect(sfxBus); o.start(t); o.stop(t + dur + 0.03);
  };
  const rasp = (t, dur, f, vol, type = 'bandpass') => {
    const s = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = getNoise(); bp.type = type; bp.frequency.value = f; bp.Q.value = 1.2;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp).connect(g).connect(sfxBus); s.start(t, Math.random() * 0.4); s.stop(t + dur + 0.02);
  };
  const bubbles = (t, n, lo, hi, vol) => { for (let i = 0; i < n; i++) { const f = lo + Math.random() * (hi - lo), tt = t + i * 0.07 + Math.random() * 0.03; call(tt, f, f * 1.6, f * 2.2, 0.06, f * 1.5, vol, 'sine', 1); } };
  const chomp = (t, vol) => { rasp(t, 0.09, 900, vol); call(t, 140, 90, 50, 0.12, 300, vol * 1.2, 'triangle', 1); };
  if (k === 'mandrill') {
    if (kind === 'grunt') { call(t0, 200, 240, 130, 0.2, 650, 0.16); rasp(t0, 0.15, 500, 0.06); }
    if (kind === 'cry') { call(t0, 900, 1400, 1100, 0.42, 2200, 0.13); call(t0, 450, 700, 550, 0.42, 1200, 0.06, 'square'); rasp(t0, 0.35, 2500, 0.05); }
    if (kind === 'roar') { call(t0, 120, 170, 90, 1.1, 500, 0.22); call(t0, 240, 330, 180, 1.1, 900, 0.08, 'square'); rasp(t0, 1.0, 600, 0.12); }
    if (kind === 'laugh') { for (let i = 0; i < 4; i++) call(t0 + i * 0.11, 760, 980, 820, 0.09, 1800, 0.11); }
    if (kind === 'dizzy') { call(t0, 700, 520, 140, 1.2, 1000, 0.13); rasp(t0, 0.5, 900, 0.05); }
  }
  if (k === 'bear') {
    if (kind === 'grunt' || kind === 'cry') { call(t0, 110, 150, 80, 0.35, 380, 0.22); rasp(t0, 0.3, 350, 0.12); }
    if (kind === 'roar') { call(t0, 70, 120, 55, 1.3, 320, 0.26); call(t0, 140, 210, 100, 1.3, 600, 0.08, 'square'); rasp(t0, 1.2, 380, 0.18); }
    if (kind === 'laugh') { for (let i = 0; i < 3; i++) { call(t0 + i * 0.18, 150, 180, 120, 0.14, 450, 0.18); rasp(t0 + i * 0.18, 0.1, 400, 0.06); } }
    if (kind === 'dizzy') { call(t0, 160, 120, 50, 1.3, 400, 0.18); rasp(t0, 0.6, 300, 0.06); }
  }
  if (k === 'catfish') {
    if (kind === 'grunt' || kind === 'cry') { bubbles(t0, 6, 220, 520, 0.1); call(t0, 90, 80, 60, 0.4, 250, 0.12, 'sine', 1); }
    if (kind === 'roar') { call(t0, 60, 75, 45, 1.6, 200, 0.28, 'sawtooth', 1); rasp(t0, 1.5, 140, 0.22, 'lowpass'); bubbles(t0 + 0.2, 12, 180, 500, 0.08); }
    if (kind === 'laugh') bubbles(t0, 8, 300, 700, 0.11);
    if (kind === 'dizzy') { bubbles(t0, 10, 150, 400, 0.09); call(t0, 120, 90, 40, 1.4, 250, 0.12, 'sine', 1); }
  }
  if (k === 'shark') {
    if (kind === 'grunt' || kind === 'cry') { chomp(t0, 0.16); chomp(t0 + 0.14, 0.12); }
    if (kind === 'roar') { rasp(t0, 0.8, 3500, 0.12, 'highpass'); chomp(t0 + 0.5, 0.2); chomp(t0 + 0.65, 0.18); chomp(t0 + 0.8, 0.16); }
    if (kind === 'laugh') { for (let i = 0; i < 3; i++) chomp(t0 + i * 0.13, 0.13); }
    if (kind === 'dizzy') { rasp(t0, 0.9, 500, 0.08, 'lowpass'); for (let i = 0; i < 6; i++) call(t0 + i * 0.12, 300 + i * 40, 500, 650, 0.06, 600, 0.06, 'sine', 1); }
  }
}

// Shared transform for every boss: flinch when hit, shake with rage, tumble when defeated.
function bossBegin(b) {
  ctx.save();
  const rage = b.rage || 0, dying = b.dead;
  const jx = b.hitT > 0 ? rand(-1.2, 1.2) : 0, jy = b.hitT > 0 ? rand(-0.8, 0.8) : 0;
  const rx = rage > 0 ? Math.sin(rage * 1.3) * 2.5 : 0;
  const p2 = b.hp < b.max * 0.5;
  if (dying) {
    const k = 110 - b.deathT;
    ctx.globalAlpha = Math.min(1, b.deathT / 40);
    ctx.translate(b.x + Math.sin(k * 0.3) * 4, b.y + k * k * 0.012);
    ctx.rotate(k * 0.04); const sc = 1 - k * 0.003; ctx.scale(sc, sc);
  } else {
    ctx.translate(b.x + jx + rx, b.y + jy);
    if (p2) { ctx.strokeStyle = `rgba(255,93,143,${0.35 + Math.sin(b.t * 0.2) * 0.15})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 2, 52 + Math.sin(b.t * 0.1) * 2, 0, TAU); ctx.stroke(); }
  }
  ctx.filter = (b.hitT > 0 && frame % 6 < 2) ? 'brightness(1.5)' : 'none';
  return { rage, dying, p2 };
}
function bossEnd() { ctx.filter = 'none'; ctx.restore(); }
function spiralEye(x, y, t, col = '#f7f1e3') {
  ctx.strokeStyle = col; ctx.lineWidth = 1.2; ctx.beginPath();
  for (let a = 0; a < 10; a += 0.4) { const r = a * 0.4; const xx = x + Math.cos(a + t * 0.3) * r, yy = y + Math.sin(a + t * 0.3) * r; a ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
  ctx.stroke();
}

function drawBear(b) {
  const { rage, dying, p2 } = bossBegin(b);
  const blk = '#1c1a1e', blk2 = '#2b282e', tan = '#c49a6c';
  // body and the white crescent ("tsukinowa") on the chest
  E(0, 22, 40, 30, blk);
  ctx.fillStyle = '#f3efe4'; ctx.beginPath();
  ctx.arc(0, 2, 26, 0.18 * Math.PI, 0.82 * Math.PI);
  ctx.arc(0, -6, 26, 0.76 * Math.PI, 0.24 * Math.PI, true);
  ctx.closePath(); ctx.fill();
  // paws: resting, or raised with claws when raging
  for (const s of [-1, 1]) {
    if (rage > 0 && !dying) {
      const fy = -24 + Math.sin(rage * 0.8 + (s > 0 ? Math.PI : 0)) * 9;
      ctx.strokeStyle = blk; ctx.lineWidth = 13; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s * 30, 14); ctx.quadraticCurveTo(s * 54, 6, s * 50, fy); ctx.stroke();
      E(s * 50, fy - 4, 10, 9, blk2);
      ctx.strokeStyle = '#f3efe4'; ctx.lineWidth = 1.6;
      for (const d of [-5, 0, 5]) { ctx.beginPath(); ctx.moveTo(s * 50 + d, fy - 11); ctx.lineTo(s * 50 + d * 1.3, fy - 17); ctx.stroke(); }
    } else {
      E(s * 34, 40, 11, 9, blk2);
      E(s * 34, 42, 5, 4, '#5a4636');
    }
  }
  // ears
  for (const s of [-1, 1]) { E(s * 21, -33, 10, 10, blk); E(s * 21, -32, 5, 5, '#4a3b30'); }
  // head
  E(0, -12, 30, 25, blk);
  E(0, -2, 13, 10, tan);                         // muzzle
  E(0, -8, 5.5, 3.8, '#0d0c0e');                  // nose
  E(-1.5, -9, 1.6, 1, 'rgba(255,255,255,0.35)');
  const eyeCol = p2 ? C.rose : '#c79a5a';
  for (const s of [-1, 1]) {
    if (dying) spiralEye(s * 12, -18, b.deathT);
    else if (rage > 0) { E(s * 12, -18, 3.5, 1.6, eyeCol); ctx.strokeStyle = '#f3efe4'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(s * 6, -23); ctx.lineTo(s * 17, -20); ctx.stroke(); }
    else { E(s * 12, -18, 3, 3.2, eyeCol); E(s * 12, -18, 1.6, 2, '#0d0c0e'); E(s * 12.8, -19, 0.7, 0.7, '#fff'); }
  }
  if (dying) { E(0, 3, 4.5, 3.5, '#3a1212'); ctx.fillStyle = '#f2a0b8'; ctx.beginPath(); ctx.ellipse(1.5, 6, 2.5, 3.5, 0.3, 0, Math.PI); ctx.fill(); }
  else if (p2 || rage > 0) {
    const open = 3 + Math.abs(Math.sin(b.t * 0.15)) * 2.5;
    E(0, 4, 8, open, '#3a1212');
    ctx.fillStyle = '#f7f1e3';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 5.5, 4 - open + 0.4); ctx.lineTo(s * 4, 4 + open * 0.5); ctx.lineTo(s * 2.5, 4 - open + 0.6); ctx.closePath(); ctx.fill(); }
  } else {
    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -4.5); ctx.lineTo(0, -1); ctx.quadraticCurveTo(-3, 2, -5.5, 0); ctx.moveTo(0, -1); ctx.quadraticCurveTo(3, 2, 5.5, 0); ctx.stroke();
  }
  bossEnd();
}

function drawCatfish(b) {
  const { rage, dying, p2 } = bossBegin(b);
  // top view, head toward the cats; belly-up when defeated
  const top = dying ? '#d8d2b8' : '#4f5343', spot = dying ? '#c4bd9f' : '#3a3d31', fin = dying ? '#c9c2a4' : '#5f6450';
  const wig = Math.sin(b.t * (rage > 0 ? 0.5 : 0.12));
  // tail fin
  ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(0, -46); ctx.quadraticCurveTo(wig * 10 - 14, -66, wig * 12 - 4, -72); ctx.quadraticCurveTo(wig * 8 + 6, -64, wig * 10 + 14, -70); ctx.quadraticCurveTo(8, -56, 0, -46); ctx.fill();
  // pectoral fins
  for (const s of [-1, 1]) { ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(s * 26, 12); ctx.quadraticCurveTo(s * 48, 16 + wig * s * 4, s * 44, 30); ctx.quadraticCurveTo(s * 34, 24, s * 24, 22); ctx.fill(); }
  // body
  ctx.fillStyle = top; ctx.beginPath();
  ctx.moveTo(0, -50); ctx.quadraticCurveTo(20 + wig * 2, -30, 32, 4); ctx.quadraticCurveTo(38, 30, 26, 40); ctx.quadraticCurveTo(0, 48, -26, 40); ctx.quadraticCurveTo(-38, 30, -32, 4); ctx.quadraticCurveTo(-20 + wig * 2, -30, 0, -50);
  ctx.fill();
  for (const [x, y, r] of [[-10, -18, 4], [12, -8, 5], [-16, 4, 3.5], [6, -30, 3], [18, 14, 3.5], [-4, 0, 3]]) E(x, y, r, r * 0.8, spot);
  // wide mouth at the front edge
  const open = (p2 || rage > 0) && !dying ? 4 + Math.abs(Math.sin(b.t * 0.18)) * 4 : 1.5;
  E(0, 41, 20, open, '#2a1a1a');
  if (open > 2) E(0, 41, 16, open * 0.6, '#c45a6a');
  // small eyes on top of the head
  for (const s of [-1, 1]) {
    if (dying) spiralEye(s * 17, 22, b.deathT, '#3a3d31');
    else if (rage > 0) { E(s * 17, 22, 3.2, 1.5, '#e8d36a'); }
    else { E(s * 17, 22, 3, 3, '#e8d36a'); E(s * 17, 22, 1.5, 1.5, '#111'); }
  }
  // the whiskers: two long ones from the lip corners, two short ones below
  ctx.strokeStyle = dying ? '#bdb595' : '#2e3027'; ctx.lineCap = 'round';
  const whip = rage > 0 ? 3.5 : 1;
  for (const s of [-1, 1]) {
    ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(s * 19, 40);
    const w1 = Math.sin(b.t * 0.12 * whip + s) * 10 * whip / (whip > 1 ? 1.6 : 1);
    ctx.bezierCurveTo(s * 34, 52 + w1, s * 48, 44 - w1, s * 62, 58 + w1); ctx.stroke();
    ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(s * 8, 43);
    const w2 = Math.sin(b.t * 0.15 * whip + s * 2) * 5;
    ctx.quadraticCurveTo(s * 12 + w2, 54, s * 16, 62 + w2); ctx.stroke();
  }
  bossEnd();
}

function drawShark(b) {
  const { rage, dying, p2 } = bossBegin(b);
  // top view, snout toward the cats; white belly shows when defeated
  const top = dying ? '#e9eef0' : '#6f8796', fin = dying ? '#cfd8dc' : '#5c7280';
  const sw = Math.sin(b.t * (rage > 0 ? 0.45 : 0.15)) * (rage > 0 ? 9 : 5);
  // tail
  ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(0, -46); ctx.quadraticCurveTo(sw - 22, -64, sw - 18, -78); ctx.quadraticCurveTo(sw, -64, sw + 20, -74); ctx.quadraticCurveTo(sw + 14, -58, 0, -46); ctx.fill();
  // pectoral fins
  for (const s of [-1, 1]) { ctx.fillStyle = fin; ctx.beginPath(); ctx.moveTo(s * 14, 4); ctx.lineTo(s * 52, -10 + sw * 0.3 * s); ctx.lineTo(s * 16, -12); ctx.closePath(); ctx.fill(); }
  // body
  ctx.fillStyle = top; ctx.beginPath();
  ctx.moveTo(sw * 0.4, -50); ctx.quadraticCurveTo(22, -24, 20, 10); ctx.quadraticCurveTo(16, 40, 0, 52); ctx.quadraticCurveTo(-16, 40, -20, 10); ctx.quadraticCurveTo(-22, -24, sw * 0.4, -50); ctx.fill();
  // dorsal fin seen from above + shading
  ctx.fillStyle = dying ? '#d9e1e4' : '#4f6472'; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(3, -26); ctx.lineTo(-3, -26); ctx.closePath(); ctx.fill();
  // gill slits
  ctx.strokeStyle = 'rgba(30,40,50,0.45)'; ctx.lineWidth = 1;
  for (const s of [-1, 1]) for (const y of [14, 19, 24]) { ctx.beginPath(); ctx.moveTo(s * 13, y); ctx.lineTo(s * 17, y - 3); ctx.stroke(); }
  // eyes
  for (const s of [-1, 1]) {
    if (dying) spiralEye(s * 11, 34, b.deathT, '#4f6472');
    else { E(s * 11, 34, 2.6, 2.6, '#0b0f14'); E(s * 11.6, 33.3, 0.7, 0.7, '#fff'); }
  }
  // jaws snap open in front when angry
  if (!dying && (p2 || rage > 0)) {
    const open = 5 + Math.abs(Math.sin(b.t * 0.25)) * 7;
    E(0, 52, 16, open, '#5a1420');
    E(0, 52, 12, open * 0.65, '#b33a4a');
    ctx.fillStyle = '#fbfbf6';
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath(); ctx.moveTo(i * 4 - 2, 52 - open + 1); ctx.lineTo(i * 4, 52 - open + 5); ctx.lineTo(i * 4 + 2, 52 - open + 1); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(i * 4 - 2, 52 + open - 1); ctx.lineTo(i * 4, 52 + open - 5); ctx.lineTo(i * 4 + 2, 52 + open - 1); ctx.closePath(); ctx.fill();
    }
  }
  bossEnd();
}

function drawBoss(b) {
  if (b.kind === 'bear') drawBear(b);
  else if (b.kind === 'catfish') drawCatfish(b);
  else if (b.kind === 'shark') drawShark(b);
  else drawMandrill(b);
}

// Attack patterns per boss. sp = bullet speed for this stage.
function bossAttack(b, sp) {
  const p2 = b.hp < b.max * 0.5, [c1, c2] = BOSS_DEFS[b.kind].shot, t = b.t;
  if (b.kind === 'bear') {
    if (!p2) {
      if (t % 60 === 0) fan(b.x, b.y + 20, 7, 1.4, sp * 1.1, c1);                    // claw swipe
      if (t % 60 === 30) fan(b.x, b.y + 20, 3, 0.25, sp * 1.4, c2);
    } else {
      if (t % 50 === 0) ring(b.x, b.y, 12 + stage * 2, sp * 0.95, t * 0.05, c1);
      if (t % 70 === 35) { fan(b.x - 40, b.y, 3, 0.5, sp * 1.3, c2); fan(b.x + 40, b.y, 3, 0.5, sp * 1.3, c2); }
    }
  } else if (b.kind === 'catfish') {
    if (!p2) {
      if (t % 52 === 0) ring(b.x, b.y + 30, 12 + stage, sp * 0.75, t * 0.07, c1);   // bubble rings
      if (t % 52 === 26) fan(b.x, b.y + 40, 1, 0, sp * 1.3, c2);
    } else {
      if (t % 5 === 0 && t % 160 < 90) { const a = Math.PI / 2 + Math.sin(t * 0.07) * 1.1; eFire(b.x, b.y + 40, Math.cos(a) * sp, Math.sin(a) * sp, 4, c1); }
      if (t % 64 === 0) ring(b.x, b.y, 16 + stage * 2, sp * 0.8, t * 0.03, c2);
    }
  } else if (b.kind === 'shark') {
    if (!p2) {
      if (t % 40 === 0) fan(b.x, b.y + 50, 3, 0.3, sp * 1.6, c1);                      // fast bite bursts
      if (t % 120 === 60) { fan(b.x - 45, b.y - 8, 2, 0.4, sp * 1.2, c2); fan(b.x + 45, b.y - 8, 2, 0.4, sp * 1.2, c2); }
    } else {
      if (t % 44 === 0) ring(b.x, b.y, 14 + stage * 2, sp, t * 0.05, c2);
      if (t % 30 === 15) fan(b.x, b.y + 50, 3, 0.25, sp * 1.8, c1);
    }
  } else {
    if (!p2) {
      if (t % 55 === 0) fan(b.x, b.y + 20, 5, 0.9, sp * 1.2, C.rose);
      if (t % 200 < 70 && t % 6 === 0) { const a = t * 0.21; eFire(b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, 4, C.violet); eFire(b.x, b.y, Math.cos(a + Math.PI) * sp, Math.sin(a + Math.PI) * sp, 4, C.violet); }
    } else {
